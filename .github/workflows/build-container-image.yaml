name: "Build container image"

"on":
  workflow_call:
    outputs:
      image:
        description: "Resulting docker image (tagged with commit SHA)"
        value: ${{ jobs.set_image_name.outputs.image }}
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Image tag
env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    -
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      with:
        platforms: >-
          amd64,
          arm64
    -
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
    -
      name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    -
      name: Determine repository metadata
      id: meta
      # language=bash
      run: |-
        # Determine sequential commit number (as of writing this, 257)
        revision="$(git rev-list --count HEAD)"
        echo "Commit count: ${revision}"
        echo "revision=${revision}" >> $GITHUB_OUTPUT
        # Determine first 7 letters of current commit hash (as of writing this, 9f63571)
        hashshort="$(git rev-parse --short=7 HEAD)"
        echo "Latest commit short hash: ${hash}"
        echo "hashshort=${hashshort}" >> $GITHUB_OUTPUT
        # Combine the two forming a sequential tag (as of writing this, r257-9f63571)
        combined="$(printf "%s-%s" "$revision" "$hash")"
        echo "Resulting tag: ${combined}"
        echo "combined=${combined}" >> $GITHUB_OUTPUT
        # Determine full hash of the latest commit (as of writing this, 9f63571a74740744486d07e9b76cb607f5fd70b1)
        hashlong="$(git rev-parse HEAD)"
        echo "Latest commit long hash: ${hash}"
        echo "hashlong=${hashshort}" >> $GITHUB_OUTPUT
    
    -
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ github.event.inputs.tag || steps.meta.outputs.tags }}
        platforms: linux/amd64,linux/arm64
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
